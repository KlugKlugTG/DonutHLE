[package]
name = "donuthle"
version = "0.1.1"
edition = "2021"
description = "Experimental high-level Android 1.6 (Donut) emulator"
license = "MIT"
repository = "https://github.com/KlugKlugTG/DonutHLE"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
anyhow = "1"
byteorder = "1"
clap = { version = "4", features = ["derive"] }
zip = "2"

[dev-dependencies]
tempfile = "3"
