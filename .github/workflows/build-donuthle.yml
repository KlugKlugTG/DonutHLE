name: Build DonutHLE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create a GitHub release with the built APK
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

concurrency:
  group: build-donuthle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
      - name: Check format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Build Rust core for Android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: |
          set -euxo pipefail
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$NDK_BIN:$PATH"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android26-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$NDK_BIN/armv7a-linux-androideabi26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_BIN/x86_64-linux-android26-clang"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android26-clang"
          export CC_armv7_linux_androideabi="$NDK_BIN/armv7a-linux-androideabi26-clang"
          export CC_x86_64_linux_android="$NDK_BIN/x86_64-linux-android26-clang"
          cargo build --release --lib --target aarch64-linux-android
          cargo build --release --lib --target armv7-linux-androideabi
          cargo build --release --lib --target x86_64-linux-android
          mkdir -p android/app/src/main/cpp/prebuilt/arm64-v8a
          mkdir -p android/app/src/main/cpp/prebuilt/armeabi-v7a
          mkdir -p android/app/src/main/cpp/prebuilt/x86_64
          cp target/aarch64-linux-android/release/libdonuthle.a android/app/src/main/cpp/prebuilt/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libdonuthle.a android/app/src/main/cpp/prebuilt/armeabi-v7a/
          cp target/x86_64-linux-android/release/libdonuthle.a android/app/src/main/cpp/prebuilt/x86_64/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: android-cargo-${{ runner.os }}-

      - name: Build Android debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Build Android release APK
        working-directory: android
        run: gradle assembleRelease --stacktrace

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/DonutHLE-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk dist/DonutHLE-release.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DonutHLE-Android-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  linux:
    name: Linux binary
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release
      - name: Package Linux artifact
        run: |
          mkdir -p dist
          cp target/release/donuthle dist/donuthle-linux-x86_64
          sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: DonutHLE-Linux-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  windows:
    name: Windows binary
    runs-on: windows-latest
    needs: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release
      - name: Package Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/donuthle.exe dist/DonutHLE-windows-x86_64.exe
          Get-FileHash dist/DonutHLE-windows-x86_64.exe -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)"
          } | Set-Content dist/SHA256SUMS.txt
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DonutHLE-Windows-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: DonutHLE-Android-${{ github.sha }}
          path: release
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: DonutHLE-Linux-${{ github.sha }}
          path: release
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: DonutHLE-Windows-${{ github.sha }}
          path: release
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: DonutHLE ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build {0}', github.run_number) }}
          generate_release_notes: true
          files: release/*
